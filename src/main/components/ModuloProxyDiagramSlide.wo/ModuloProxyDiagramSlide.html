<section class="slide slide-diagram">
	<h2>modulo as a reverse proxy</h2>
	<svg class="diagram" viewBox="0 0 1000 400" role="img" aria-label="A browser talks to Apache, which passes WO requests to modulo, which routes them to application instances. wotaskd tells modulo which instances exist, and starts and watches them.">
		<defs>
			<marker id="arrow-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
				<path d="M 0 0 L 10 5 L 0 10 z" class="d-arrowhead" />
			</marker>
		</defs>
		<rect x="0" y="95" width="130" height="80" rx="12" class="d-box" />
		<text x="65" y="141" class="d-title" text-anchor="middle">Browser</text>

		<rect x="180" y="60" width="210" height="150" rx="12" class="d-box" />
		<text x="285" y="92" class="d-title" text-anchor="middle">Apache</text>
		<text x="285" y="122" class="d-text" text-anchor="middle">TLS, certificates (certbot)</text>
		<text x="285" y="144" class="d-text" text-anchor="middle">sites, static files</text>
		<text x="285" y="166" class="d-text" text-anchor="middle">mod_proxy to modulo</text>

		<rect x="440" y="60" width="250" height="150" rx="12" class="d-box d-accent" />
		<text x="565" y="92" class="d-title" text-anchor="middle">modulo</text>
		<text x="565" y="122" class="d-text" text-anchor="middle">routes /Apps/WebObjects/…</text>
		<text x="565" y="144" class="d-text" text-anchor="middle">to the right instance</text>
		<text x="565" y="166" class="d-text" text-anchor="middle">adds the x-webobjects-* headers</text>

		<rect x="760" y="40" width="220" height="190" rx="12" class="d-group" />
		<text x="870" y="68" class="d-title" text-anchor="middle">Application instances</text>
		<rect x="780" y="84" width="180" height="36" rx="7" class="d-box" />
		<text x="870" y="107" class="d-text-strong" text-anchor="middle">MyApp 1 · :2001</text>
		<rect x="780" y="128" width="180" height="36" rx="7" class="d-box" />
		<text x="870" y="151" class="d-text-strong" text-anchor="middle">MyApp 2 · :2002</text>
		<rect x="780" y="172" width="180" height="36" rx="7" class="d-box" />
		<text x="870" y="195" class="d-text-strong" text-anchor="middle">MyApp 3 · :2003</text>

		<rect x="440" y="300" width="250" height="80" rx="12" class="d-box" />
		<text x="565" y="335" class="d-title" text-anchor="middle">wotaskd</text>
		<text x="565" y="360" class="d-text" text-anchor="middle">:1085, configured by JavaMonitor</text>

		<line x1="130" y1="135" x2="176" y2="135" class="d-arrow" marker-end="url(#arrow-p)" />
		<line x1="390" y1="135" x2="436" y2="135" class="d-arrow" marker-end="url(#arrow-p)" />
		<line x1="690" y1="135" x2="756" y2="135" class="d-arrow" marker-end="url(#arrow-p)" />
		<line x1="565" y1="298" x2="565" y2="214" class="d-arrow d-arrow-quiet" marker-end="url(#arrow-p)" />
		<text x="575" y="262" class="d-label">which instances, on which hosts</text>
		<path d="M 690 340 C 760 340, 870 320, 870 234" class="d-arrow d-arrow-quiet" marker-end="url(#arrow-p)" />
		<text x="780" y="365" class="d-label">starts and watches</text>
	</svg>
</section>
